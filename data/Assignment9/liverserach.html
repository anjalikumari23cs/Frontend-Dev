<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .search-container{
            width: 300px;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        #search-box {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        #loading {
            font-style: italic;
            color: gray;
        }
        .product {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .product img {
            margin-right: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="search-box" placeholder="Search products...">
        <div id="loading" style="display:none;">Loading...</div>
        <div id="results"></div>
    </div>
    <script>
        $(document).ready(function () {
            $("#search-box").on("keyup", function () {
                let query = $(this).val().trim();

                $("#loading").show();

                $.ajax({
                    url: "/products",        
                    type: "GET",
                    data: { q: query },      
                    success: function (response) {
                        $("#loading").hide(); 

                        $("#results").empty();

                        if (response.length === 0) {
                            $("#results").html("<p>No products found</p>");
                        } else {
                            response.forEach(function (product) {
                                $("#results").append(`
              <div class="product">
                <img src="${product.image}" alt="${product.name}" width="80">
                <h4>${product.name}</h4>
                <p>Price: $${product.price}</p>
              </div>
            `);
                            });
                        }
                    },
                    error: function () {
                        $("#loading").hide();
                        $("#results").html("<p>Error fetching products</p>");
                    }
                });
            });
        });
    </script>
</body>
</html>
