<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="dashboard">
        <h2>Employee Status Dashboard</h2>
        <div id="employees"></div>
    </div>

    <div id="error" style="color:red; display:none;"></div>
    <script>
        // Fetch all employees on page load
        document.addEventListener("DOMContentLoaded", function () {
            fetchEmployees();
        });

        function fetchEmployees() {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "http://localhost:3000/employees", true);

            xhr.onload = function () {
                if (xhr.status === 200) {
                    const employees = JSON.parse(xhr.responseText);
                    renderEmployees(employees);
                } else {
                    showError("Failed to load employees.");
                }
            };

            xhr.onerror = function () {
                showError("Network error while fetching employees.");
            };

            xhr.send();
        }

        function renderEmployees(employees) {
            const container = document.getElementById("employees");
            container.innerHTML = "";

            employees.forEach(emp => {
                const row = document.createElement("div");
                row.className = "employee-row";

                row.innerHTML = `
      <span>${emp.name}</span>
      <label class="switch">
        <input type="checkbox" ${emp.status === "active" ? "checked" : ""}>
        <span class="slider"></span>
      </label>
      <span class="status">${emp.status}</span>
    `;

                const checkbox = row.querySelector("input[type='checkbox']");
                const statusText = row.querySelector(".status");

                checkbox.addEventListener("change", function () {
                    const newStatus = checkbox.checked ? "active" : "inactive";
                    const oldStatus = emp.status;

                    // Update UI immediately
                    statusText.textContent = newStatus;

                    // Send PATCH request
                    const patchXhr = new XMLHttpRequest();
                    patchXhr.open("PATCH", `http://localhost:3000/employees/${emp.id}`, true);
                    patchXhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");

                    patchXhr.onload = function () {
                        if (patchXhr.status === 200) {
                            emp.status = newStatus; // update local state
                        } else {
                            revertUI();
                        }
                    };

                    patchXhr.onerror = function () {
                        revertUI();
                    };

                    patchXhr.send(JSON.stringify({ status: newStatus }));

                    function revertUI() {
                        checkbox.checked = oldStatus === "active";
                        statusText.textContent = oldStatus;
                        showError(`Failed to update ${emp.name}'s status.`);
                    }
                });

                container.appendChild(row);
            });
        }

        function showError(message) {
            const errorDiv = document.getElementById("error");
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
        }
    </script>
</body>

</html>
