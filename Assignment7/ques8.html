<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="box-model.css" />
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="ques8.css">
</head>

<body>
    <header>
        <h1>CSS Box Model Exploration</h1>
    </header>

    <main class="container">
        <div class="box-wrapper">
            <div class="box content-box">
                <p>Content-box</p>
                <small>Default box-sizing: padding and border add to total size.</small>
            </div>
            <div class="box border-box">
                <p>Border-box</p>
                <small>box-sizing: border-box; keeps total size fixed.</small>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Anjali Kumari</p>
    </footer>
</body>

</html>
