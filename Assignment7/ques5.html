<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ques5.css">
</head>

<body>
    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>
        <section>
            <h2>Attribute Selectors</h2>
            <input type="text" placeholder="Type something..." />
            <a href="https://example.com">Secure Link</a>
            <a href="http://example.com">Non-secure Link</a>
        </section>

        <section>
            <h2>Pseudo-classes & Pseudo-elements</h2>
            <ul class="demo-list">
                <li>Item One</li>
                <li>Item Two</li>
                <li>Item Three</li>
                <li>Item Four</li>
            </ul>
        </section>

        <section class="combinator-demo">
            <h2>Combinator Selectors</h2>
            <div class="parent">
                <p>Direct child</p>
                <span>Adjacent sibling</span>
                <span>General sibling</span>
                <div>
                    <p>Descendant paragraph</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Anjali Kumari</p>
    </footer>

</body>

</html>
