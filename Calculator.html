<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator using JavaScript</title>
</head>
<body>
    <input type="text" id="input">
    <p id="pid"></p>
    <button onclick="calc('1')">1</button>
    <button onclick="calc('2')">2</button>
    <button onclick="calc('3')">3</button>
    <button onclick="calc('4')">4</button>
    <button onclick="calc('6')">6</button>
    <button onclick="calc('7')">7</button>
    <button onclick="calc('8')">8</button>
    <button onclick="calc('+')">+</button>
    <button onclick="res()">Result</button>
    
    <script>
        let p=document.getElementById("pid");
        let input=document.getElementById("input");
        function calc(val){
            input.value+=val;
        }
        function res(){
            p.innerText=eval(input.value);
        }

    </script>
</body>
</html>
