<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            border-collapse:collapse;
            width:60%;
        }
        thead{
            color:white;
            background-color:blue;
        }
        tr, td{
            border:2px solid black;
            padding:10px;
            text-align:center;
        }
        .row{
            color:blue;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <th>Column</th>
            <th>Column</th>
            <th>Column</th>
            <th>Column</th>
            <th>Column</th>
        </thead>
        <tbody>
            <tr>
                <td class="row">Row</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td> 
            </tr>
            <tr>
                <td class="row">Row</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td> 
            </tr>
            <tr>
                <td class="row">Row</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td>
            </tr>
            <tr>
                <td class="row">Row</td>
                <td>Data</td>
                <td>Data</td>
                <td>Data</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
