<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropDown based Selection page</title>
</head>
<body>
    <h1>Selection Page</h1>
    <h3>Select Country</h3>
    <select>
        <option selected>India</option>
        <option >China</option>
        <option >Nepal</option>
    </select>
    <h3>Select State</h3>
    <select>
        <option selected>UttarPradesh</option>
        <option>Madhya Pradesh</option>
        <option>Bihar</option>
    </select>
    <h3>Select City</h3>
    <select>
        <option selected>Agra</option>
        <option>Mumbai</option>
        <option>Delhi</option>
    </select>
    <h3>Tourist Places</h3>
    <select>
        <option selected>Taj Mahal</option>
        <option>Meenaksi Temple</option>
        <option>GateWay of India</option>
    </select>
</body>
</html>
