<head>

    <title>Course Registration form</title>
</head>
<body>
    <h2>Course Registration Form</h2>
    <form>
        <fieldset>
            <legend>Student Information</legend><br>
            <label>Name</label>
            <input type="text"><br><br>
            <label>Email</label>
            <input type="email"><br><br>
            <label>Select course</label>
            <select>
                <option value="">Select</option>
                <option value="web">Web Development</option>
                <option value="ML">Machine Learning</option>
                <option value="ds">DataScience</option>
                <option value="da">Data Structure and Algorithim</option>
            </select><br><br>
        </fieldset>
        <br>
        <fieldset>
            <legend>Available Course Schedule</legend><br>
            <table border="2">
                <thead>
                    <th>Day</th>
                    <th>Instructor</th>
                    <th>Time</th>
                </thead>
                <tbody>
                    <tr>
                        <td>Monday</td>
                        <td>Mr. Suresh</td>
                        <td>8:00 - 9:00</td>
                    </tr>
                    <tr>
                        <td>Monday</td>

                        <td>8:00 - 9:00</td>
                    </tr>
                    <tr>
                        <td>WednessDay</td>
                        <td>Mr. Kavesh</td>
                        <td>9:00 - 10:00</td>
                    </tr>
                    <tr>
                        <td>Friday</td>

                    </tr>
                </tbody>
            </table><br>
        </fieldset>
    </form>
</body>
</html>
