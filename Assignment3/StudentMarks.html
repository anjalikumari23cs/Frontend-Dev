<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>
</head>

<body>
    <h1>Colonel's Brightland Public School</h1>
    <table border="1" width="50%">
        <caption><h3>Student Marks</h3></caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Math</th>
                <th>Science</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>95</td>
                <td>88</td>
            </tr>
            <tr>
                <td>Jane</td>
                <td>89</td>
                <td>92</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>184</td>
                <td>180</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
