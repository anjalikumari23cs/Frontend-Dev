<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="gallery">
    <figure class="item blur">
      <img src="image1.jpg" alt="Blur Image" />
      <figcaption>Blur</figcaption>
    </figure>
    <figure class="item grayscale">
      <img src="image2.jpg" alt="Grayscale Image" />
      <figcaption>Grayscale</figcaption>
    </figure>
    <figure class="item sepia">
      <img src="image3.jpg" alt="Sepia Image" />
      <figcaption>Sepia</figcaption>
    </figure>
    <figure class="item brightness">
      <img src="image4.jpg" alt="Brightness Image" />
      <figcaption>Brightness</figcaption>
    </figure>
    <figure class="item contrast">
      <img src="image5.jpg" alt="Contrast Image" />
      <figcaption>Contrast</figcaption>
    </figure>
    <figure class="item hue">
      <img src="image6.jpg" alt="Hue Rotate Image" />
      <figcaption>Hue Rotate</figcaption>
    </figure>
  </div>
</body>
</html>
