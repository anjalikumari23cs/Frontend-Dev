<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="pseudo-classes.css" />
    <title>Pseudo-Class Showcase</title>
    <link rel="stylesheet" href="ques1.css">
</head>

<body>
    <header>
        <h1>Pseudo-Class Demonstration</h1>
    </header>

    <main class="demo-row">
        <section class="demo-box hover-demo">
            <a href="#">Hover over me</a>
            <p>:hover changes background on mouseover</p>
        </section>

        <section class="demo-box focus-demo">
            <input type="text" placeholder="Click to focus" />
            <p>:focus highlights input when active</p>
        </section>

        <section class="demo-box active-demo">
            <button>Click Me</button>
            <p>:active triggers when button is pressed</p>
        </section>

        <section class="demo-box nth-demo">
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
                <li>Item 4</li>
            </ul>
            <p>:nth-child(odd) styles alternate list items</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Anjali Kumari</p>
    </footer>
</body>

</html>
