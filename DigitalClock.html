<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        #id {
            font-size: 48px;
            font-family: 'Arial', sans-serif;
            color: white;
            background-color: blue;
            border-radius: 20px;
            font-size: 4rem;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f2eded;
        }

        h1 {
            font-size: 5rem;
            margin-top:10px;
            padding:10px;
        }
        .conatainer {
            text-align: center;
            background-color: white;
            margin:50px;
            padding:30px;
        }
    </style>
</head>

<body>
    <div class="conatainer">
        <h1>Digital Clock</h1>
        <div id="id">00:00:00</div>
    </div>
    <script>
        function timecount() {
            let data = new Date();
            let hr = String(data.getHours()).padStart(2, '0');
            let min = String(data.getMinutes()).padStart(2, '0');
            let sec = String(data.getSeconds()).padStart(2, '0');
            document.getElementById("id").textContent = `${hr}:${min}:${sec}`;
        }
        setInterval(timecount, 1000);
        timecount();
    </script>
</body>

</html>
